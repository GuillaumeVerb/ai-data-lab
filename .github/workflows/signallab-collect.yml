name: SignalLab collect

on:
  schedule:
    # 06:00 UTC — a new UTC day for the Observe series.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signallab-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNALLAB_PERSIST_RAW: "0"
        run: python -m signallab collect
      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signallab/snapshots data/signallab/lexicon.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Record SignalLab daily snapshots for Observe."
          git push
